<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" role="img" aria-labelledby="title desc">
  <title id="title">AUDE</title>
  <desc id="desc">Bronze A arch symbol with AUDE wordmark</desc>
  <defs>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7a163"/>
      <stop offset="0.52" stop-color="#b3743f"/>
      <stop offset="1" stop-color="#82502f"/>
    </linearGradient>
    <linearGradient id="doorLight" x1="0" y1="0" x2="0.9" y2="1">
